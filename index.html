// ==================== ИГРОВОЙ ЦИКЛ ====================
function gameLoop(delta) {
    if (game.bankrupt) return; // игра окончена — ждём перезапуска

    // День/ночь
    game.dayTime += delta * 2;
    if (game.dayTime >= 180) { game.dayTime -= 180; endOfDay(); }
    const wasNight = game.isNight;
    game.isNight = game.dayTime > 90 && game.dayTime < 150;
    if (wasNight !== game.isNight) {
        scene.background = new THREE.Color(game.isNight ? 0x0a0a1e : 0x1a1a2e);
        ambientLight.intensity = game.isNight ? 0.2 : 0.5;
        sun.intensity = game.isNight ? 0.8 : 2.5;
        applySeasonVisuals();
    }

    processScrap(delta);
    processContracts(delta);
    updatePump(delta);
    if (wasteIsFull() && pump.state === 'idle') {
        game._wasteWarn = (game._wasteWarn || 0) + delta;
        if (game._wasteWarn >= 8) { game._wasteWarn = 0; toast('🛑 Ремонт стоит! Куб отработки полон — вызови откачку 🛢️', '#f85149'); }
    }

    if (game.reputation >= 30 && !game.contractOffer) {
        game.contractTimer += delta;
        if (game.contractTimer >= game.contractInterval) {
            game.contractTimer = 0;
            generateContractOffer();
        }
    }

    // Случайные события
    if (!game.currentEvent && !game.contractOffer) {
        game.eventTimer += delta;
        if (game.eventTimer >= game.eventInterval) {
            game.eventTimer = 0;
            generateRandomEvent();
        }
    }

    // Погодные/сезонные модификаторы скорости ремонта
    let weatherMult = 1.0;
    if (game.weather === 'Снег') weatherMult = 0.85;
    else if (game.weather === 'Дождь') weatherMult = 0.93;
    if (game.season === 1) weatherMult *= 1.05; // летом чуть быстрее

    const speed = getGlobalMechanicSpeed();
    const nowMs = performance.now();
    for (const bay of game.bays) {
        if (!bay.order) continue;
        const curWork = currentWorkInfo(bay.order).work;
        const mech = getBestMechanicFor(curWork);
        let bonus = mech.specialty === curWork.category ? 1.3 : 1.0;
        bonus *= getToolBonus(curWork);
        if (game.isNight) bonus *= 1.3;
        bonus *= weatherMult;
        bonus *= 1 + 0.25 * ((bay.assignedMechCount || 1) - 1); // больше работников в боксе — быстрее
        if (!wasteIsFull()) bay.order.progress += speed * bonus * delta; // при полном кубе ремонт стоит
        // режиссура: ставим машину и реквизит по текущей операции
        applyChoreography(bay, nowMs);
        // анимация механиков — все шевелятся и работают инструментом
        if (bay.mechs) {
            for (const f of bay.mechs) {
                if (!f.visible) continue;
                const ph = (f.userData.phase || 0);
                f.position.y = Math.abs(Math.sin(nowMs * 0.006 + ph)) * 0.04;
                const arm = f.getObjectByName('arm');
                if (arm) arm.rotation.x = Math.sin(nowMs * 0.014 + ph) * 1.0 - 0.3; // машет инструментом
                const tool = f.getObjectByName('tool');
                if (tool) tool.rotation.x = Math.sin(nowMs * 0.014 + ph) * 0.8;
                const legL = f.getObjectByName('legL'), legR = f.getObjectByName('legR');
                if (legL) legL.rotation.x = Math.sin(nowMs * 0.008 + ph) * 0.18;
                if (legR) legR.rotation.x = -Math.sin(nowMs * 0.008 + ph) * 0.18;
                f.rotation.z = Math.sin(nowMs * 0.005 + ph) * 0.03; // лёгкое покачивание корпусом
            }
        }
        if (bay.progressBar && bay.progressBar.visible) {
            const fill = bay.progressBar.getObjectByName('fill');
            if (fill) {
                const pct = Math.min(1, bay.order.progress / bay.order.totalTime);
                fill.scale.x = 2.18 * pct;
                fill.position.x = -1.09 + 1.09 * pct;
                fill.material.color.setHex(pct > 0.7 ? 0xFFAA00 : pct > 0.4 ? 0x88CC00 : 0x00CC44);
            }
        }
        if (bay.order.progress >= bay.order.totalTime) completeOrder(bay, bay.order);
    }

    // Свободные рабочие в курилке — лёгкое «живое» покачивание и затяжка
    for (const f of idleFigures) {
        if (!f.visible) continue;
        const ph = f.userData.idlePhase || 0;
        f.rotation.z = Math.sin(nowMs * 0.002 + ph) * 0.04;
        const arm = f.getObjectByName('arm');
        const cig = f.getObjectByName('cig');
        const puff = (Math.sin(nowMs * 0.0016 + ph) + 1) / 2; // 0..1 — рука подносит сигарету ко рту
        if (arm) arm.rotation.x = -0.3 - puff * 1.0;
        if (cig) cig.position.set(0.16 + 0.04 * (1 - puff), 0.7 + puff * 0.18, 0.26 - puff * 0.06);
    }

    // Частицы погоды (дождь/снег)
    if (weatherGroup.visible) {
        for (const p of weatherParticles) {
            p.position.y -= p.userData.speed * delta;
            if (p.position.y < 0) {
                p.position.set((Math.random() - 0.5) * 22, 12, (Math.random() - 0.5) * 22);
            }
        }
    }

    for (let i = activeSparks.length - 1; i >= 0; i--) {
        const sys = activeSparks[i];
        let alive = false;
        for (const s of sys.particles) {
            s.userData.age += delta;
            if (s.userData.age < s.userData.life) {
                alive = true;
                s.position.add(s.userData.vel.clone().multiplyScalar(delta));
                s.userData.vel.y += 9.8 * delta;
                s.material.opacity = 1 - s.userData.age / s.userData.life;
            } else s.visible = false;
        }
        if (!alive) { scene.remove(sys.group); activeSparks.splice(i, 1); }
    }

    for (const order of game.orders) {
        if (!order.smokeSystem) continue;
        for (const p of order.smokeSystem.particles) {
            p.userData.age += delta;
            if (p.userData.age >= p.userData.life) {
                const qs = queueSlot(game.orders.indexOf(order));
                p.position.set(qs.x, 0.7, qs.z);
                p.userData.age = 0;
                p.scale.setScalar(p.userData.baseScale);
                p.material.opacity = 0.4;
            } else {
                p.position.add(p.userData.vel.clone().multiplyScalar(delta));
                p.scale.setScalar(p.userData.baseScale + p.userData.age * 0.25);
                p.material.opacity = 0.4 * (1 - p.userData.age / p.userData.life);
            }
        }
    }
}

// ==================== КОНЕЦ ДНЯ / ЭКОНОМИКА ====================
function endOfDay() {
    const rent = 80 * game.garageLevel;
    let salaries = 0;
    for (const m of game.mechanics) if (m.id !== 0) salaries += 40 * m.level;
    const total = rent + salaries;
    game.money -= total;

    if (game.moneyEarnedToday > game.recordMoneyDay) game.recordMoneyDay = game.moneyEarnedToday;
    const earned = game.moneyEarnedToday;
    game.moneyEarnedToday = 0;

    game.dayCount++;
    game.season = Math.floor((game.dayCount - 1) / 3) % 4; // сезон каждые 3 дня
    rollWeather();
    applySeasonVisuals();
    applyWeatherLook();

    // банкротство
    if (game.money < 0) game.debtDays++; else game.debtDays = 0;
    if (game.debtDays >= 3 || game.money <= -2500) { triggerBankruptcy(); return; }

    const net = earned - total;
    toast(`📅 День ${game.dayCount-1} закрыт. Заработано ${earned}💰, расходы ${total}💰 (итог ${net>=0?'+':''}${net}💰). ${SEASON_ICONS[game.season]} ${SEASONS[game.season]}, ${weatherIcon(game.weather)} ${game.weather}`, net >= 0 ? '#3fb950' : '#f78166');
    if (game.money < 200) toast('⚠️ Денег почти не осталось — бери заказы, иначе разоришься!', '#f85149');

    checkAchievements();
    saveGame(true); // автосейв в конце дня
    updateUI();
}

function rollWeather() {
    let pool;
    if (game.season === 3) pool = ['Ясно', 'Снег', 'Снег', 'Туман', 'Ясно'];        // зима
    else if (game.season === 2) pool = ['Ясно', 'Дождь', 'Дождь', 'Туман', 'Ясно']; // осень
    else if (game.season === 0) pool = ['Ясно', 'Дождь', 'Туман', 'Ясно'];          // весна
    else pool = ['Ясно', 'Ясно', 'Ясно', 'Дождь'];                                  // лето
    game.weather = pool[Math.floor(Math.random() * pool.length)];
}

function triggerBankruptcy() {
    game.bankrupt = true;
    sfxError();
    const modal = document.getElementById('eventModal');
    const content = document.getElementById('eventModalContent');
    content.innerHTML = `

        <button class="btn-3d green" id="restartBtn" style="margin-top:10px;">🔄 Начать заново</button>`;
    modal.style.display = 'flex';

}

// ==================== ЗВУК ====================
let audioCtx = null, humGain = null;
function initAudio() {
    if (audioCtx) return;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        humGain = audioCtx.createGain();
        humGain.gain.value = 0;
        humGain.connect(audioCtx.destination);
        const osc = audioCtx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.value = 55;
        const filt = audioCtx.createBiquadFilter();
        filt.type = 'lowpass';
        filt.frequency.value = 180;
        osc.connect(filt); filt.connect(humGain); osc.start();
        humGain.gain.linearRampToValueAtTime(game.soundOn ? 0.035 : 0, audioCtx.currentTime + 1.5);
        game.humStarted = true;
    } catch (e) {}
}
function beep(freq, dur, type, vol) {
    if (!audioCtx || !game.soundOn) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
}
function sfxClick() { beep(420, 0.05, 'square', 0.06); }
function sfxDing()  { beep(880, 0.12, 'sine', 0.14); setTimeout(() => beep(1320, 0.16, 'sine', 0.12), 90); }
function sfxCash()  { beep(660, 0.07, 'triangle', 0.12); setTimeout(() => beep(990, 0.1, 'triangle', 0.1), 70); }
function sfxError() { beep(150, 0.25, 'sawtooth', 0.12); }
function setSound(on) {
    game.soundOn = on;
    if (humGain && audioCtx) humGain.gain.linearRampToValueAtTime(on ? 0.035 : 0, audioCtx.currentTime + 0.3);
}

// ==================== СОХРАНЕНИЕ / ЗАГРУЗКА ====================
function findWork(name) { return workTypes.find(w => w.name === name); }
function findTruck(name) { return truckTypes.find(t => t.name === name) || truckTypes[0]; }
function serializeOrder(o) {
    return { id: o.id, works: orderWorks(o).map(w => w.name),
             mainWork: o.mainWork.name, extraWork: o.extraWork ? o.extraWork.name : null,
             money: o.money, totalTime: o.totalTime, progress: o.progress, truckType: o.truckType.name,
             paintColor: o.paintColor, dented: o.dented };
}
function deserializeOrder(s) {
    const works = (s.works && s.works.length) ? s.works.map(n => findWork(n)).filter(Boolean) : null;
    const mainWork = findWork(s.mainWork) || (works && works[0]) || workTypes[0];
    return {
        id: s.id,
        works: works || (s.extraWork ? [mainWork, findWork(s.extraWork)] : [mainWork]),
        mainWork,
        extraWork: s.extraWork ? findWork(s.extraWork) : (works && works[1]) || null,
        money: s.money, totalTime: s.totalTime, progress: s.progress || 0,
        assignedBay: null, truckType: findTruck(s.truckType),
        truckMesh: null, sparkSystem: null, smokeSystem: null,
        paintColor: s.paintColor || null, dented: !!s.dented,
    };
}

function saveGame(silent) {
    try {
        const save = {
            money: game.money, reputation: game.reputation, garageLevel: game.garageLevel,
            receptionist: game.receptionist, mechanics: game.mechanics, tools: game.tools,
            bays: game.bays.map(b => ({ id: b.id })),
            totalOrdersCompleted: game.totalOrdersCompleted, totalMoneyEarned: game.totalMoneyEarned,
            partsInventory: game.partsInventory, orderIdCounter: game.orderIdCounter, maxOrders: game.maxOrders,
            dayCount: game.dayCount, season: game.season, weather: game.weather, recordMoneyDay: game.recordMoneyDay,
            prestige: game.prestige, prestigeMult: game.prestigeMult,
            achievements: game.achievements, soundOn: game.soundOn,
            wasteOil: game.wasteOil,
            savedOrders: game.orders.map(serializeOrder),
            savedBayOrders: game.bays.filter(b => b.order).map(b => ({ bayId: b.id, order: serializeOrder(b.order) })),
            contracts: game.contracts.map(c => ({ companyName: c.companyName, work: c.work.name, count: c.count, reward: c.reward, progress: c.progress })),
            scrapTrucks: game.scrapTrucks.map(s => ({ progress: s.progress, totalTime: s.totalTime })),
        };
        localStorage.setItem('slesarSave', JSON.stringify(save));
        if (!silent) toast('💾 Игра сохранена', '#58a6ff');
    } catch (e) { if (!silent) toast('Не удалось сохранить', '#f85149'); }
}

function loadGame() {
    const data = localStorage.getItem('slesarSave');
    if (!data) { applySeasonVisuals(); return false; }
    try {
        const save = JSON.parse(data);
        game.money = save.money ?? 500;
        game.reputation = save.reputation ?? 10;
        if (save.garageLevel) { game.garageLevel = save.garageLevel; createGarageBuilding(0, -4.5, game.garageLevel); }
        if (save.receptionist) game.receptionist = save.receptionist;
        // тихо «дотягиваем» уровень, если в старом сохранении накопился лишний опыт
        { const r = game.receptionist;
          while (r.exp >= r.expToNext) { r.exp -= r.expToNext; r.level++; r.expToNext = Math.floor(r.expToNext * 1.5); r.skillPoints++; }
        }
        if (save.mechanics) game.mechanics = save.mechanics;
        if (save.tools) game.tools = save.tools;
        if (save.totalOrdersCompleted) game.totalOrdersCompleted = save.totalOrdersCompleted;
        if (save.totalMoneyEarned) game.totalMoneyEarned = save.totalMoneyEarned;
        if (save.partsInventory) game.partsInventory = save.partsInventory;
        if (save.orderIdCounter) game.orderIdCounter = save.orderIdCounter;
        if (save.maxOrders) game.maxOrders = save.maxOrders;
        if (save.dayCount) game.dayCount = save.dayCount;
        if (typeof save.season === 'number') game.season = save.season;
        if (save.weather) game.weather = save.weather;
        if (save.recordMoneyDay) game.recordMoneyDay = save.recordMoneyDay;
        if (save.prestige) game.prestige = save.prestige;
        if (save.prestigeMult) game.prestigeMult = save.prestigeMult;
        if (save.achievements) game.achievements = save.achievements;
        if (typeof save.soundOn === 'boolean') game.soundOn = save.soundOn;
        if (typeof save.wasteOil === 'number') { game.wasteOil = save.wasteOil; updateWasteVisual(); }

        // дополнительные боксы (по фиксированным позициям, не больше лимита; только недостающие)
        if (save.bays && save.bays.length > game.bays.length) {
            const count = Math.min(save.bays.length, game.maxBays);
            for (let i = game.bays.length; i < count; i++) {
                const pos = BAY_POSITIONS[i] || { x: -3.4 * i, z: 1 };
                const g = createBaySlot();
                g.position.set(pos.x, 0, pos.z);
                scene.add(g);
                const pb = createProgressBar(); pb.position.copy(g.position); scene.add(pb);
                game.bays.push({ id: i, order: null, mesh: g, progressBar: pb });
            }
        }
        refreshAllBayEquipment(); // восстановить купленный инструмент в боксах
        // заказы в очереди
        if (save.savedOrders) save.savedOrders.forEach(s => {
            const order = deserializeOrder(s);
            const truck = createTruck(order.truckType);
            const slot = queueSlot(game.orders.length);
            truck.position.set(slot.x, 0, slot.z);
            truck.rotation.y = Math.PI;
            truck.scale.setScalar(QUEUE_SCALE);
            scene.add(truck);
            order.truckMesh = truck;
            order.smokeSystem = createSmokeEffect(new THREE.Vector3(slot.x, 0.7, slot.z));
            game.orders.push(order);
        });
        // заказы в боксах (в процессе ремонта)
        if (save.savedBayOrders) save.savedBayOrders.forEach(rec => {
            const bay = game.bays.find(b => b.id === rec.bayId);
            if (!bay) return;
            const order = deserializeOrder(rec.order);
            const truck = createTruck(order.truckType);
            const target = bay.mesh.position.clone(); target.y = 0; target.z += 0.8;
            truck.position.copy(target); truck.rotation.y = Math.PI; scene.add(truck);
            order.truckMesh = truck; order.assignedBay = bay.id;
            bay.order = order;
            if (bay.progressBar) bay.progressBar.visible = true;
            updateBayMechanics(bay);
        });
        // контракты
        if (save.contracts) save.contracts.forEach(c => {
            const truck = createTruck(truckTypes[Math.floor(Math.random() * truckTypes.length)]);
            truck.position.set(-8, 0, 5); truck.rotation.y = Math.PI / 2; scene.add(truck);
            game.contracts.push({ id: Date.now() + Math.random(), companyName: c.companyName, work: findWork(c.work) || workTypes[0], count: c.count, reward: c.reward, progress: c.progress || 0, truckMesh: truck });
        });
        // разборка
        if (save.scrapTrucks) save.scrapTrucks.forEach(s => {
            const truck = createTruck(truckTypes[Math.floor(Math.random() * truckTypes.length)]);
            truck.position.set(-7, 0, 3 + game.scrapTrucks.length * 2.5); truck.rotation.y = Math.PI / 2;
            (truck.userData.paintParts || []).forEach(c => { if (c.material && c.material.color) c.material.color.setHex(0x885555); });
            scene.add(truck);
            game.scrapTrucks.push({ truckMesh: truck, progress: s.progress || 0, totalTime: s.totalTime || 15 });
        });

        game.maxOrders = 3 + game.receptionist.level; // согласуем с уровнем приёмщика
        applySeasonVisuals();
        applyWeatherLook();
        return true;
    } catch (e) { console.warn('Ошибка загрузки сохранения:', e); applySeasonVisuals(); return false; }
}

// ==================== СОБЫТИЯ (привязка кнопок) ====================
document.getElementById('findOrderBtn3d').addEventListener('click', addNewOrder);
document.getElementById('expandBtn3d').addEventListener('click', expandGarage);
document.getElementById('upRecBtn3d').addEventListener('click', upgradeReceptionist);
document.getElementById('hireMechBtn').addEventListener('click', hireMechanic);
document.getElementById('scrapBtn').addEventListener('click', buyScrapTruck);
document.getElementById('pumpBtn').addEventListener('click', callPumpTruck);
document.getElementById('warehouseBtn').addEventListener('click', () => { document.getElementById('warehouseModal').style.display = 'flex'; updateWarehouseModal(); });
document.getElementById('restorePartBtn').addEventListener('click', restorePart);
document.getElementById('sellPartBtn').addEventListener('click', sellAllUsed);
document.getElementById('statsBtn').addEventListener('click', () => { document.getElementById('statsModal').style.display = 'flex'; renderStats(); });
document.getElementById('achievementsBtn').addEventListener('click', () => { document.getElementById('achievementsModal').style.display = 'flex'; renderAchievements(); });
document.getElementById('saveGameBtn').addEventListener('click', () => saveGame(false));
document.getElementById('resetGameBtn').addEventListener('click', () => { if (confirm('Сбросить весь прогресс?')) { localStorage.removeItem('slesarSave'); location.reload(); } });

// Кнопка звука
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', () => {
    setSound(!game.soundOn);
    soundBtn.textContent = game.soundOn ? '🔊' : '🔇';
    saveGame(true);
});

// Делегирование кнопок в окне прокачки (вместо setTimeout-костыля)
document.getElementById('statsModal').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const a = btn.dataset.action;
    if (a === 'upgradeGarage') upgradeGarage();
    else if (a === 'buyLift') buyTool('lift');
    else if (a === 'buyDiag') buyTool('diagnosticStand');
    else if (a === 'buyTire') buyTool('tireMachine');
    else if (a === 'skillUpsell') upgradeReceptionistSkill('upsell');
    else if (a === 'skillSearch') upgradeReceptionistSkill('clientSearch');
    else if (a === 'skillLegal') upgradeReceptionistSkill('legalWork');
    else if (a === 'prestige') doPrestige();
    renderStats();
});

// Звук клика по любой кнопке + разблокировка аудио по первому касанию
document.addEventListener('click', (e) => { if (e.target.closest('.btn-3d')) sfxClick(); });
document.addEventListener('pointerdown', () => { initAudio(); if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); });

window.addEventListener('resize', () => { camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(container.clientWidth, container.clientHeight); });

// Автосохранение каждые 30 секунд
setInterval(() => { if (!game.bankrupt) saveGame(true); }, 30000);

// ==================== РЕНДЕР ====================
const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.1);
    gameLoop(delta);
    controls.update();
    renderer.render(scene, camera);
    uiTimer += delta;
    if (uiTimer > 0.3) {
        uiTimer = 0;
        updateHUD();
        if (statsOpen()) renderStats();
        // прогресс контрактов/разборки тикает в реальном времени → перерисовываем список
        if (game.contracts.length || game.scrapTrucks.length) renderSidebar();
    }
}

// ==================== СТАРТ ====================
const hadSave = loadGame();
if (!hadSave) { addNewOrder(); addNewOrder(); }
soundBtn.textContent = game.soundOn ? '🔊' : '🔇';
updateUI();
animate();
</script>
